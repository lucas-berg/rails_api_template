name: Update Knapsack Report

on:
  workflow_dispatch:
# This workflow should be scheduled at certain intervals
# schedule:
#    - cron: '0 0 1 */3 *'
# The above cron would schedule it every 3 months. Replace with the wanted periodicity.

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test

    steps:
    - uses: actions/checkout@v5
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
    - run: corepack enable && yarn install --immutable
    - run: bundle exec rails assets:precompile
    - name: Setup Database
      run: bundle exec rails db:create db:migrate
    - name: Update Knapsack Report
      run: HEADLESS=true KNAPSACK_GENERATE_REPORT=true bundle exec rspec
    - name: Propose updated timings
      uses: peter-evans/create-pull-request@v7
      with:
        add-paths: knapsack_rspec_report.json
        commit-message: Update Knapsack report
        branch: update-knapsack-report
        title: Update Knapsack report
