name: CD

on:
  workflow_dispatch:
  #   push:
      # Uncomment and add the necessary branches to enable automatic deployment on AWS
      # branches:
        # - main

jobs:
  deploy:
    name: Deploy on AWS ECS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest

      - name: Download task definition
        env:
          TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
          TASK_FILE: ${{ vars.ECS_TASK_DEFINITION_PATH }}
        run: aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --query taskDefinition > "$TASK_FILE"

      - name: Select environment secrets
        id: format-secrets
        if: vars.SSM_PARAMETER_PATH != ''
        env:
          PARAMETER_PATH: ${{ vars.SSM_PARAMETER_PATH }}
        run: |
          aws ssm describe-parameters \
            --parameter-filters "Key=Path,Option=Recursive,Values=$PARAMETER_PATH" \
            --query 'Parameters[].{Name:Name,ARN:ARN}' --output json > params.json
          ./bin/format_aws_secrets params.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.1
        with:
          task-definition: ${{ vars.ECS_TASK_DEFINITION_PATH }}
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.build-and-push.outputs.digest }}
          secrets: |
            ${{ steps.format-secrets.outputs.formatted_secrets }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
