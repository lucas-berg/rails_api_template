name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RAILS_ENV: test
  CI: true
  PARALLEL_TEST_FIRST_IS_1: true

jobs:
  label:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prod Docker image
        uses: docker/build-push-action@v6
        with:
          push: false
          cache-from: |
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=main
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max
          file: Dockerfile

  development-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: bin/wait-for-web
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  linters:
    name: Linters
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Run yarn commands
        run: yarn install --immutable
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run Code Analysis
        run: bundle exec rails code:analysis
      - name: Run linter on production Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: "Dockerfile"

      - name: Run linter on dev Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: "Dockerfile.dev"
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        # Set N number of parallel jobs you want to run tests on.
        # Use higher number if you have slow tests to split them on more parallel jobs.
        # Remember to update ci_node_index below to 0..N-1
        ci_node_total: [1]
        # set N-1 indexes for parallel jobs
        # When you run 2 parallel jobs then first job will have index 0, the second job will have index 1 etc
        ci_node_index: [0]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Run yarn commands
        run: yarn install --immutable
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Setup Database
        run: |
          bundle exec rails parallel:load_schema
          bundle exec rails parallel:migrate
      - name: Check for untracked changes in schema.rb
        run: |
          if git diff --exit-code db/schema.rb; then
            echo "No changes in schema.rb"
          else
            echo "Error: schema.rb has uncommitted changes. Please commit the schema changes."
            exit 1
          fi
      - name: Precompile assets
        run: bundle exec rails assets:precompile
      - name: Get CPU info
        id: cpu_info
        run: echo "cpu_cores=$(nproc)" >> "$GITHUB_ENV"
      - name: Run Tests
        env:
          KNAPSACK_CI_NODE_TOTAL: ${{ matrix.ci_node_total }}
          KNAPSACK_CI_NODE_INDEX: ${{ matrix.ci_node_index }}
          PARALLEL_TESTS_CONCURRENCY: ${{ env.cpu_cores }}
        run: HEADLESS=true bundle exec parallel_rspec -n "$PARALLEL_TESTS_CONCURRENCY" -e './bin/parallel_tests'
      - name: Check for missing annotations
        run: bundle exec annotaterb models
      - name: Check for untracked changes in app and spec directories
        run: |
          if git diff --exit-code app/ spec/; then
            echo "No changes in app/ and spec/"
          else
            echo "Error: app/ or spec/ has uncommitted changes. Please commit the annotation changes."
            exit 1
          fi
      - name: Rename coverage files
        run: mv coverage/coverage.json coverage/coverage-${{ matrix.ci_node_index }}.json
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: "coverage-${{ matrix.ci_node_index }}"
          path: coverage/coverage-${{ matrix.ci_node_index }}.json
      - name: Check the OpenAPI contract
        if: matrix.ci_node_index == 0
        env:
          OPENAPI: "1"
          OPENAPI_OUTPUT: tmp/openapi-ci.yaml
          TEST_ENV_NUMBER: "1"
        run: |
          bundle exec rspec spec/requests/api --order defined
          diff -u doc/openapi.yaml tmp/openapi-ci.yaml
