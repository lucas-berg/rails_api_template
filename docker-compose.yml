services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST: db
      PORT: "3000"
      DOCKER_ENABLED: "false"
      RATE_LIMIT_REDIS_URL: redis://redis:6379/2
    tty: true
    stdin_open: true
    volumes:
      - .:/src/app
      - node_modules:/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/status"]
        interval: 5s
        timeout: 10s
        retries: 3
        start_period: 40s
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
volumes:
  db_data:
  node_modules:
