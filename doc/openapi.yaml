---
openapi: 3.0.3
info:
  title: rails_api_template
  version: 1.0.0
servers: []
paths:
  "/api/v1/auth_sessions":
    get:
      summary: index
      tags:
      - API::V1::AuthSession
      security:
      - BearerAuth: []
      responses:
        '200':
          description: lists only the current user active sessions without token identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        created_at:
                          type: string
                        expires_at:
                          type: string
                        last_used_at:
                          type: string
                        user_agent:
                          type: string
                        ip_address:
                          type: string
                      required:
                      - id
                      - created_at
                      - expires_at
                      - last_used_at
                      - user_agent
                      - ip_address
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total
                required:
                - data
                - meta
        '401':
          description: requires a bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
  "/api/v1/auth_sessions/{id}":
    delete:
      summary: destroy
      tags:
      - API::V1::AuthSession
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: revokes another API session without signing out this one
        '404':
          description: does not revoke another user session
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
  "/api/v1/deletion_requests/{id}":
    delete:
      summary: destroy
      tags:
      - API::V1::DeletionRequest
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: allows the requester to cancel with their password and restores
            the previous team status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      subject_type:
                        type: string
                      subject_id:
                        type: integer
                      status:
                        type: string
                      stage:
                        type: string
                      scheduled_at:
                        type: string
                      completed_at:
                        nullable: true
                      canceled_at:
                        type: string
                      failure_code:
                        nullable: true
                      created_at:
                        type: string
                    required:
                    - id
                    - subject_type
                    - subject_id
                    - status
                    - stage
                    - scheduled_at
                    - completed_at
                    - canceled_at
                    - failure_code
                    - created_at
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
        '409':
          description: hides other users requests and rejects cancellation after processing
            starts
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              properties:
                current_password:
                  type: string
                  format: password
                  writeOnly: true
    get:
      summary: show
      tags:
      - API::V1::DeletionRequest
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: shows the requested deletion schedule without exposing the
            encrypted completion recipient
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      subject_type:
                        type: string
                      subject_id:
                        type: integer
                      status:
                        type: string
                      stage:
                        type: string
                      scheduled_at:
                        type: string
                      completed_at:
                        nullable: true
                      canceled_at:
                        nullable: true
                      failure_code:
                        nullable: true
                      created_at:
                        type: string
                    required:
                    - id
                    - subject_type
                    - subject_id
                    - status
                    - stage
                    - scheduled_at
                    - completed_at
                    - canceled_at
                    - failure_code
                    - created_at
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
  "/api/v1/invitations/accept":
    post:
      summary: create
      tags:
      - API::V1::InvitationAcceptance
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: accepts an invitation once and safely replays for an existing
            member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      team_id:
                        type: integer
                      user_id:
                        type: integer
                      role:
                        type: string
                      status:
                        type: string
                      created_at:
                        type: string
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                          username:
                            type: string
                          first_name:
                            type: string
                          last_name:
                            type: string
                        required:
                        - id
                        - email
                        - username
                        - first_name
                        - last_name
                    required:
                    - id
                    - team_id
                    - user_id
                    - role
                    - status
                    - created_at
                    - user
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
        '409':
          description: does not restore membership by replaying an already accepted
            invitation after removal
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
  "/api/v1/notification_preferences":
    get:
      summary: show
      tags:
      - API::V1::NotificationPreference
      security:
      - BearerAuth: []
      responses:
        '200':
          description: returns defaults without creating a record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      activity_in_app:
                        type: boolean
                      activity_email:
                        type: boolean
                      security_in_app:
                        type: boolean
                      security_email:
                        type: boolean
                    required:
                    - activity_in_app
                    - activity_email
                    - security_in_app
                    - security_email
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
    patch:
      summary: update
      tags:
      - API::V1::NotificationPreference
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_preferences:
                  type: object
                  properties:
                    activity_in_app:
                      type: boolean
                    activity_email:
                      type: boolean
                  required:
                  - activity_in_app
                  - activity_email
              required:
              - notification_preferences
      responses:
        '200':
          description: updates optional channels for only the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      activity_in_app:
                        type: boolean
                      activity_email:
                        type: boolean
                      security_in_app:
                        type: boolean
                      security_email:
                        type: boolean
                    required:
                    - activity_in_app
                    - activity_email
                    - security_in_app
                    - security_email
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
        '400':
          description: rejects recipient injection
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
    put:
      summary: update
      tags:
      - API::V1::NotificationPreference
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_preferences:
                  type: object
                  properties:
                    activity_email:
                      type: boolean
                  required:
                  - activity_email
              required:
              - notification_preferences
      responses:
        '200':
          description: updates optional notification channels through the PUT alias
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      activity_in_app:
                        type: boolean
                      activity_email:
                        type: boolean
                      security_in_app:
                        type: boolean
                      security_email:
                        type: boolean
                    required:
                    - activity_in_app
                    - activity_email
                    - security_in_app
                    - security_email
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
  "/api/v1/ready":
    get:
      summary: ready
      tags:
      - API::V1::Health
      responses:
        '200':
          description: checks the database and shared rate limit store
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required:
                - ready
        '503':
          description: reports unavailable dependencies without exposing connection
            details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required:
                - ready
  "/api/v1/security_notifications":
    get:
      summary: index
      tags:
      - API::V1::SecurityNotification
      security:
      - BearerAuth: []
      responses:
        '200':
          description: lists personal security notifications separately from team
            activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        kind:
                          type: string
                        category:
                          type: string
                        team_id:
                          nullable: true
                        read_at:
                          nullable: true
                        created_at:
                          type: string
                        title:
                          type: string
                        body:
                          type: string
                      required:
                      - id
                      - kind
                      - category
                      - team_id
                      - read_at
                      - created_at
                      - title
                      - body
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total
                required:
                - data
                - meta
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
  "/api/v1/security_notifications/{id}/read":
    post:
      summary: read
      tags:
      - API::V1::SecurityNotification
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: marks a personal security notification as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      kind:
                        type: string
                      category:
                        type: string
                      team_id:
                        nullable: true
                      read_at:
                        type: string
                      created_at:
                        type: string
                      title:
                        type: string
                      body:
                        type: string
                    required:
                    - id
                    - kind
                    - category
                    - team_id
                    - read_at
                    - created_at
                    - title
                    - body
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
  "/api/v1/settings/must_update":
    get:
      summary: must_update
      tags:
      - API::V1::Setting
      parameters:
      - name: device_version
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: returns no need to update
          content:
            application/json:
              schema:
                type: object
                properties:
                  must_update:
                    type: boolean
                required:
                - must_update
        '400':
          description: returns a client error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                      required:
                      - message
                required:
                - errors
  "/api/v1/status":
    get:
      summary: status
      tags:
      - API::V1::Health
      responses:
        '200':
          description: returns the api status
          content:
            application/json:
              schema:
                type: object
                properties:
                  online:
                    type: boolean
                required:
                - online
  "/api/v1/teams":
    get:
      summary: index
      tags:
      - API::V1::Team
      security:
      - BearerAuth: []
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: only lists teams for the current active member with capped
            pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        slug:
                          type: string
                        status:
                          type: string
                        timezone:
                          type: string
                        locale:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                      - id
                      - name
                      - slug
                      - status
                      - timezone
                      - locale
                      - created_at
                      - updated_at
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total
                required:
                - data
                - meta
        '401':
          description: requires authentication with the new error envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
    post:
      summary: create
      tags:
      - API::V1::Team
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: object
                  properties:
                    name:
                      type: string
                    timezone:
                      type: string
                    locale:
                      type: string
                  required:
                  - name
                  - timezone
                  - locale
              required:
              - team
      responses:
        '201':
          description: creates a team with an owner and audit event atomically
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      status:
                        type: string
                      timezone:
                        type: string
                      locale:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    - status
                    - timezone
                    - locale
                    - created_at
                    - updated_at
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
        '400':
          description: hides another team and rejects forged ownership attributes
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
        '422':
          description: rejects an invalid timezone without partially creating the
            team
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          type: string
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
  "/api/v1/teams/{id}":
    get:
      summary: show
      tags:
      - API::V1::Team
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: returns the authorized current team
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      status:
                        type: string
                      timezone:
                        type: string
                      locale:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    - status
                    - timezone
                    - locale
                    - created_at
                    - updated_at
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
    patch:
      summary: update
      tags:
      - API::V1::Team
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                  - name
              required:
              - team
      responses:
        '200':
          description: updates permitted team fields using PATCH
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      status:
                        type: string
                      timezone:
                        type: string
                      locale:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    - status
                    - timezone
                    - locale
                    - created_at
                    - updated_at
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
        '409':
          description: rejects team writes by a viewer and suspended teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        field:
                          nullable: true
                      required:
                      - code
                      - message
                      - field
                  request_id:
                    type: string
                required:
                - errors
                - request_id
    put:
      summary: update
      tags:
      - API::V1::Team
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                  - name
              required:
              - team
      responses:
        '200':
          description: updates permitted team fields using PUT
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      status:
                        type: string
                      timezone:
                        type: string
                      locale:
                        type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - name
                    - slug
                    - status
                    - timezone
                    - locale
                    - created_at
                    - updated_at
                  meta:
                    type: object
                    properties: {}
                required:
                - data
                - meta
  "/api/v1/teams/{team_id}/audit_events":
    get:
      summary: index
      tags:
      - API::V1::AuditEvent
      security:
      - BearerAuth: []
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: lets managers read the team audit history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        team_id:
                          type: integer
                        actor_type:
                          type: string
                        actor_id:
                          type: integer
                        action:
                          type: string
                        target_type:
                          type: string
                        target_id:
                          type: integer
                        request_id:
                          nullable: true
                        reason:
                          nullable: true
                        metadata:
                          type: object
                          properties: {}
                        occurred_at:
                          type: string
                      required:
                      - id
                      - team_id
                      - actor_type
                      - actor_id
                      - action
                      - target_type
                      - target_id
                      - request_id
                      - reason
                      - metadata
                      - occurred_at
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total
                required:
                - data
                - meta
        '403':
          description: denies audit history to ordinary members
          content:
            application/json:
              schema:
                type: object
